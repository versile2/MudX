name: Prepare MudX release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer without a v prefix (for example, 9.9.0)
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release pull request
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate stable SemVer input
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be stable SemVer without a v prefix" >&2
            exit 1
          fi

      - name: Checkout current dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Create or resume the version branch from current dev
        shell: bash
        run: |
          set -Eeuo pipefail
          branch="release/${VERSION}"
          echo "RELEASE_BRANCH=$branch" >>"$GITHUB_ENV"
          if git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"; then
            git switch --create "$branch" --track "origin/$branch"
            git merge --no-edit origin/dev
          else
            git switch --create "$branch" origin/dev
          fi

      - name: Update the MudX project version with structured XML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'src/MudX/MudX.csproj'
          $document = [System.Xml.Linq.XDocument]::Load(
            $path,
            [System.Xml.Linq.LoadOptions]::PreserveWhitespace)
          $versions = @($document.Root.Elements('PropertyGroup').Elements('Version'))
          if ($versions.Count -ne 1) {
            throw "Expected exactly one MudX project Version element; found $($versions.Count)"
          }
          $versions[0].Value = $env:VERSION
          $temporary = "$path.tmp"
          $settings = [System.Xml.XmlWriterSettings]::new()
          $settings.Encoding = [System.Text.UTF8Encoding]::new($false)
          $settings.Indent = $false
          $settings.OmitXmlDeclaration = $null -eq $document.Declaration
          $writer = [System.Xml.XmlWriter]::Create($temporary, $settings)
          try {
            $document.Save($writer)
          }
          finally {
            $writer.Dispose()
          }
          Move-Item -Force $temporary $path

      - name: Verify the version through MSBuild
        shell: bash
        run: |
          set -Eeuo pipefail
          actual=$(dotnet msbuild src/MudX/MudX.csproj -nologo -getProperty:Version | tail -n 1 | tr -d '\r')
          if [[ "$actual" != "$VERSION" ]]; then
            echo "MSBuild resolved Version '$actual'; expected '$VERSION'" >&2
            exit 1
          fi

      - name: Restore focused release projects
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet restore tests/MudX.UnitTests/MudX.UnitTests.csproj --nologo
          dotnet restore src/MudX.Docs/MudX.Docs.csproj --nologo

      - name: Regenerate tracked static and docs assets
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet run \
            --project src/MudX.Generator/MudX.Generator.csproj \
            --configuration Release \
            --framework net10.0 \
            -- src/MudX/wwwroot src/MudX/Scripts
          dotnet build \
            src/MudX.Docs/MudX.Docs.csproj \
            --configuration Release \
            --no-restore \
            --nologo \
            /p:BuildInParallel=false

      - name: Run focused release checks
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet build src/MudX/MudX.csproj --configuration Release --no-restore --nologo
          dotnet test \
            tests/MudX.UnitTests/MudX.UnitTests.csproj \
            --configuration Release \
            --no-restore \
            --nologo \
            --blame-hang \
            --blame-hang-timeout 60s

      - name: Commit and push the release branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --update
          if git diff --cached --quiet; then
            echo "No release preparation changes were produced" >&2
            exit 1
          fi
          git commit -m "Prepare MudX ${VERSION} release"
          git push origin "$RELEASE_BRANCH"

      - name: Create or update the release pull request
        shell: bash
        run: |
          set -Eeuo pipefail
          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$RELEASE_BRANCH" \
            --base dev \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          if [[ -z "$pr_number" ]]; then
            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$RELEASE_BRANCH" \
              --base dev \
              --title "Prepare MudX ${VERSION} release" \
              --body "Updates the MudX version and regenerated release assets. This pull request requires human review and merge." \
              --label "release")
            echo "Created $pr_url"
          else
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$pr_number/labels" \
              --input - <<<'{"labels":["release"]}'
            echo "Updated release pull request #$pr_number"
          fi
